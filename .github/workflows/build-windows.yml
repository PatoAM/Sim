name: Build Windows Executable

on:
  push:
    tags:
      - 'v*' # Se dispara cuando hacés git push --tags (ej: v1.0.0)
  workflow_dispatch: # También te permite ejecutarlo manualmente desde la web de GitHub

permissions:
  contents: write # Necesario para poder publicar en GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configurar Python e instalar dependencias
        run: |
          uv python install 3.12
          uv sync --dev
          uv add --dev pyinstaller

      - name: Compilar .exe con PyInstaller
        run: |
          uv run pyinstaller --onefile --console --name simulador-so main.py

      - name: Subir binario como Artifact (para pruebas rápidas)
        uses: actions/upload-artifact@v4
        with:
          name: simulador-so-windows
          path: dist/simulador-so.exe

      - name: Publicar en GitHub Releases (solo si es un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/simulador-so.exe
